[workspace]
members = [
    "crates/zuno-core",
    "crates/zuno-audio",
    "crates/zuno-mcp",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.17"
edition = "2024"
license = "MIT"
description = "Zuno — lightweight, offline-first music player for humans and AI (MCP)"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
lofty = "0.22"
notify = "8"
rodio = { version = "0.20", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2"

# Strip heavy DWARF debug blobs from third-party crates in dev/test builds (~65% smaller target/debug)
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
debug = false
panic = "abort"

# Rapid local release build (no LTO bitcode bloat, fast link)
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
