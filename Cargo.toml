[workspace]
members = [
    "crates/zuno-core",
    "crates/zuno-audio",
    "crates/zuno-mcp",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.0.11"
edition = "2024"
license = "MIT"
description = "Zuno — lightweight, offline-first music player for humans and AI (MCP)"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
lofty = "0.22"
notify = "8"
rodio = { version = "0.20", features = ["symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
